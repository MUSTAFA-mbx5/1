<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مكتبة المصطفى</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Segoe UI', Tahoma, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: linear-gradient(-45deg, #1a1a2e, #16213e, #0f3460, #533483);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            overflow: hidden;
            position: relative;
        }

        /* خلفية متحركة */
        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* دوائر ضوئية في الخلفية */
        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.5;
            animation: float 8s ease-in-out infinite;
            pointer-events: none;
        }
        .orb-1 {
            width: 300px; height: 300px;
            background: #667eea;
            top: -80px; right: -80px;
            animation-delay: 0s;
        }
        .orb-2 {
            width: 250px; height: 250px;
            background: #764ba2;
            bottom: -60px; left: -60px;
            animation-delay: 2s;
        }
        .orb-3 {
            width: 200px; height: 200px;
            background: #f093fb;
            top: 50%; left: 10%;
            animation-delay: 4s;
        }
        @keyframes float {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-30px) scale(1.05); }
        }

        /* البطاقة الزجاجية */
        .card {
            position: relative;
            z-index: 10;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 28px;
            padding: 60px 45px;
            max-width: 480px;
            width: 100%;
            text-align: center;
            box-shadow: 
                0 25px 50px rgba(0, 0, 0, 0.4),
                inset 0 1px 0 rgba(255, 255, 255, 0.3);
        }

        .emoji {
            font-size: 80px;
            margin-bottom: 20px;
            display: inline-block;
            filter: drop-shadow(0 8px 16px rgba(0,0,0,0.3));
            animation: bounce 3s ease-in-out infinite;
        }
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        h1 {
            color: #ffffff;
            font-size: 32px;
            margin-bottom: 16px;
            font-weight: 700;
            text-shadow: 0 2px 10px rgba(0,0,0,0.3);
            letter-spacing: 0.5px;
        }

        p {
            color: rgba(255, 255, 255, 0.85);
            font-size: 17px;
            line-height: 1.8;
            margin-bottom: 36px;
            text-shadow: 0 1px 4px rgba(0,0,0,0.2);
        }

        .btn {
            display: inline-block;
            padding: 18px 45px;
            font-size: 19px;
            font-weight: 700;
            color: #fff;
            text-decoration: none;
            border-radius: 16px;
            background: linear-gradient(135deg, rgba(102,126,234,0.9), rgba(118,75,162,0.9));
            border: 1px solid rgba(255, 255, 255, 0.3);
            box-shadow: 
                0 10px 30px rgba(102,126,234,0.4),
                inset 0 1px 0 rgba(255,255,255,0.3);
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
            transition: left 0.6s ease;
        }

        .btn:hover::before {
            left: 100%;
        }

        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 
                0 15px 40px rgba(102,126,234,0.6),
                inset 0 1px 0 rgba(255,255,255,0.4);
            background: linear-gradient(135deg, rgba(102,126,234,1), rgba(118,75,162,1));
        }

        .btn:active {
            transform: translateY(-1px);
        }

        /* شعار صغير أسفل البطاقة */
        .footer-text {
            margin-top: 30px;
            font-size: 13px;
            color: rgba(255, 255, 255, 0.5);
            letter-spacing: 1px;
        }

        @media (max-width: 480px) {
            .card { padding: 45px 25px; }
            h1 { font-size: 26px; }
            .emoji { font-size: 65px; }
        }
    </style>
</head>
<body>
    <!-- دوائر ضوئية زخرفية -->
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>

    <!-- البطاقة الزجاجية -->
    <div class="card">
        <div class="emoji">📚</div>
        <h1>مرحباً بك في مكتبة المصطفى</h1>
        <p>يمكنك تفعيل تلكرام بسهولة من خلال إضافة البروكسيات والاتصال بها.</p>
        <a href="proxies.html" class="btn">🚀 المتابعة إلى البروكسيات</a>
        <div class="footer-text">مكتبة المصطفى © 2025</div>
    </div>
</body>
</html>
