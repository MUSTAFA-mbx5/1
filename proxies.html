<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مكتبة المصطفى</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', Tahoma, sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .card {
            background: white;
            border-radius: 20px;
            padding: 50px 40px;
            max-width: 500px;
            width: 100%;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        .emoji { font-size: 70px; margin-bottom: 20px; }
        h1 { color: #2c3e50; font-size: 30px; margin-bottom: 15px; }
        p { color: #666; font-size: 17px; line-height: 1.7; margin-bottom: 30px; }
        .btn {
            display: inline-block;
            padding: 16px 40px;
            font-size: 19px;
            font-weight: bold;
            color: white;
            text-decoration: none;
            border-radius: 12px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 6px 20px rgba(102,126,234,0.4);
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(102,126,234,0.5);
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="emoji">📚</div>
        <h1>مرحباً بك في مكتبة المصطفى</h1>
        <p>يمكنك تفعيل تلكرام بسهولة من خلال إضافة البروكسيات والاتصال بها.</p>
        <a href="proxies.html" class="btn">🚀 المتابعة إلى البروكسيات</a>
    </div>
</body>
</html>
