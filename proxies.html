<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>البروكسيات - مكتبة المصطفى</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background: #f0f2f5;
            min-height: 100vh;
            padding: 30px 20px;
        }
        .container { max-width: 700px; margin: 0 auto; }
        .header { text-align: center; margin-bottom: 30px; }
        .header h1 { color: #2c3e50; font-size: 26px; margin-bottom: 10px; }
        .header p { color: #666; font-size: 15px; }

        .proxy-card {
            background: white;
            border-radius: 15px;
            padding: 22px;
            margin-bottom: 16px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            border-right: 5px solid #667eea;
        }
        .proxy-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
            flex-wrap: wrap;
            gap: 8px;
        }
        .proxy-name { font-size: 17px; font-weight: bold; color: #2c3e50; }
        .proxy-badge {
            background: #e8f0fe;
            color: #1967d2;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
        }
        .proxy-info {
            background: #f8f9fa;
            padding: 12px 15px;
            border-radius: 8px;
            margin-bottom: 14px;
            font-family: monospace;
            font-size: 12px;
            color: #555;
            word-break: break-all;
            direction: ltr;
            text-align: left;
        }
        .proxy-info div { margin: 3px 0; }
        .proxy-info span { color: #2c3e50; font-weight: bold; }

        .actions { display: flex; gap: 10px; }
        .btn {
            flex: 1;
            padding: 12px 18px;
            font-size: 15px;
            font-weight: bold;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            text-decoration: none;
            text-align: center;
            display: block;
            transition: opacity 0.2s;
        }
        .btn:hover { opacity: 0.88; }
        .btn-connect { background: #28a745; }
        .btn-copy { background: #6c757d; }

        .notice {
            background: #fff3cd;
            border: 1px solid #ffeaa7;
            color: #856404;
            padding: 15px 20px;
            border-radius: 10px;
            margin-top: 20px;
            font-size: 14px;
            line-height: 1.7;
        }

        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: #333;
            color: white;
            padding: 12px 25px;
            border-radius: 8px;
            opacity: 0;
            transition: all 0.3s;
            z-index: 1000;
        }
        .toast.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }

        .error-box {
            background: #f8d7da;
            color: #721c24;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            font-size: 15px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🔌 بروكسيات مكتبة المصطفى</h1>
            <p>اضغط "اتصال" أمام كل بروكسي لإضافته إلى تيليجرام</p>
        </div>

        <!-- سيتم إدراج البروكسيات تلقائياً من data.js -->
        <div id="proxiesContainer"></div>

        <div class="notice">
            💡 <b>طريقة الاستخدام:</b> اضغط زر "✅ اتصال" أمام كل بروكسي، سيفتح تيليجرام ويطلب إضافة البروكسي — اضغط "إضافة" أو "Enable". كرر العملية مع جميع البروكسيات. سيقوم تيليجرام بحفظها ويختار تلقائياً الأسرع.
        </div>
    </div>

    <div class="toast" id="toast">✅ تم النسخ بنجاح</div>

    <!-- تحميل ملف البيانات -->
    <script src="data.js"></script>

    <script>
        (function() {
            const container = document.getElementById('proxiesContainer');

            // التحقق من وجود ملف البيانات
            if (typeof CONFIG === 'undefined' || !CONFIG.proxies) {
                container.innerHTML = '<div class="error-box">⚠️ لم يتم العثور على ملف البيانات data.js أو أنه غير صالح. تأكد من رفعه بجانب هذا الملف.</div>';
                return;
            }

            // بناء رابط البروكسي بصيغة tg://
            function buildProxyLink(p) {
                return `tg://proxy?server=${encodeURIComponent(p.server)}&port=${p.port}&secret=${encodeURIComponent(p.secret)}`;
            }

            // إدراج كل بروكسي في الصفحة
            CONFIG.proxies.forEach(function(p) {
                const link = buildProxyLink(p);
                const card = document.createElement('div');
                card.className = 'proxy-card';
                card.innerHTML = `
                    <div class="proxy-header">
                        <div class="proxy-name">${p.name}</div>
                        <div class="proxy-badge">MTProto</div>
                    </div>
                    <div class="proxy-info">
                        <div><span>Server:</span> ${p.server}</div>
                        <div><span>Port:</span> ${p.port}</div>
                        <div><span>Secret:</span> ${p.secret}</div>
                    </div>
                    <div class="actions">
                        <a href="${link}" class="btn btn-connect">✅ اتصال</a>
                        <button class="btn btn-copy" data-link="${link}">📋 نسخ</button>
                    </div>
                `;
                container.appendChild(card);
            });

            // تفعيل أزرار النسخ
            container.querySelectorAll('.btn-copy').forEach(function(btn) {
                btn.addEventListener('click', function() {
                    const link = btn.getAttribute('data-link');
                    navigator.clipboard.writeText(link).then(function() {
                        const toast = document.getElementById('toast');
                        toast.classList.add('show');
                        setTimeout(() => toast.classList.remove('show'), 2000);
                    });
                });
            });
        })();
    </script>
</body>
</html>
